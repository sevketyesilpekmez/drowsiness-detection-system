server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA: bilinmeyen path'leri index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MJPEG stream için ayrı location: buffering kapalı ve uzun read_timeout
    # yalnızca bu endpoint'e özel. nginx en uzun eşleşen prefix'i seçtiği
    # için ("/api/stream" > "/api/") sıralama önemli değil, okunabilirlik
    # için ayrı tutuluyor.
    location /api/stream {
        proxy_pass http://backend:5000/api/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Backend'e genel reverse proxy. docker-compose network'ünde servis adı
    # "backend" olarak çözülür (bkz. docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
